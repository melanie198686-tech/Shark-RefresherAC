<!DOCTYPE html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Shark Refresher</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"> <style> *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } :root { --bg: #030303; --panel: rgba(15, 15, 15, 0.72); --panel-hi: rgba(22, 22, 22, 0.88); --border: rgba(255, 255, 255, 0.08); --border-hi: rgba(255, 255, 255, 0.16); --text: #ffffff; --text-dim: #a1a1a1; --text-faint: #5a5a5a; --white: #ffffff; --silver: #d4d4d4; --success: #ffffff; --danger: #ff7070; --warn: #e8e8e8; --radius: 18px; --radius-sm: 12px; --mono: 'JetBrains Mono', ui-monospace, monospace; --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; } html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; } /* ========================================================= BACKGROUND ========================================================= */ body { background: radial-gradient( circle at 50% -10%, rgba(255, 255, 255, 0.075), transparent 38% ), #030303; } .aurora { position: fixed; inset: 0; z-index: -4; pointer-events: none; overflow: hidden; } .aurora::before { content: ""; position: absolute; width: 700px; height: 700px; top: -300px; left: 50%; transform: translateX(-50%); background: radial-gradient( circle, rgba(255, 255, 255, 0.09), transparent 68% ); filter: blur(80px); } .aurora::after { content: ""; position: absolute; width: 900px; height: 900px; bottom: -500px; left: 50%; transform: translateX(-50%); background: radial-gradient( circle, rgba(255, 255, 255, 0.045), transparent 70% ); filter: blur(90px); } /* ===================== ay: grid; place-items: center; font-size: 31px; background: linear-gradient( 145deg, #ffffff, #bdbdbd 48%, #666666 ); box-shadow: 0 15px 45px rgba(255, 255, 255, 0.12), 0 0 35px rgba(255, 255, 255, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.8); animation: bob 4s ease-in-out infinite; } @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } } .brand-name { font-size: 26px; font-weight: 700; letter-spacing: -0.7px; background: linear-gradient( 180deg, #ffffff, #b5b5b5 ); -webkit-background-clip: text; background-clip: text; color: transparent; } .brand-sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; font-family: var(--mono); } /* ========================================================= PANELS ========================================================= */ .panel { position: relative; background: linear-gradient( 145deg, rgba(25, 25, 25, 0.78), rgba(7, 7, 7, 0.78) ); backdrop-filter: blur(24px) saturate(120%); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 25px 60px rgba(0,0,0,0.65); } .panel::before { content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 1px; background: linear-gradient( 90deg, transparent, rgba(255,255,255,0.18), transparent ); opacity: 0.6; } .panel-label { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); display: flex; align-items: center; gap: 9px; } .panel-label::before { content: ""; width: 3px; height: 12px; border-radius: 3px; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); } /* ========================================================= INPUT ========================================================= */ .input { width: 100%; background: rgba(0,0,0,0.55); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--mono); font-size: 12px; line-height: 1.6; padding: 14px 16px; outline: none; transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; word-break: break-all; } textarea.input { min-height: 100px; resize: vertical; } .input::placeholder { color: var(--text-faint); } .input:focus { border-color: rgba(255,255,255,0.38); background: rgba(0,0,0,0.72); box-shadow: 0 0 0 4px rgba(255,255,255,0.055), 0 0 25px rgba(255,255,255,0.025); } /* ========================================================= DROPZONE ========================================================= */ .dropzone { border: 1.5px dashed rgba(255,255,255,0.15); border-radius: var(--radius-sm); padding: 22px; text-align: center; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: all 0.2s ease; background: rgba(255,255,255,0.012); display: flex; flex-direction: column; align-items: center; gap: 8px; } .dropzone:hover, .dropzone.drag { border-color: rgba(255,255,255,0.5); color: var(--text); background: rgba(255,255,255,0.035); transform: translateY(-1px); box-shadow: 0 10px 30px rgba(0,0,0,0.25), inset 0 0 25px rgba(255,255,255,0.02); } .dropzone .dz-icon { font-size: 22px; opacity: 0.7; transition: transform 0.2s; } .dropzone:hover .dz-icon { transform: translateY(-3px); } .dropzone strong { color: #fff; font-weight: 500; } /* ========================================================= BUTTONS ========================================================= */ .btn { font-family: var(--sans); font-size: 13.5px; font-weight: 500; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 13px 20px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px; transition: transform 0.1s ease, background 0.15s, border-color 0.15s, box-shadow 0.15s; white-space: nowrap; user-select: none; } .btn:active:not(:disabled) { transform: scale(0.975); } .btn:disabled { opacity: 0.45; cursor: not-allowed; } .btn-primary { background: linear-gradient( 180deg, #ffffff, #cfcfcf ); color: #050505; flex: 1; box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 12px 30px rgba(255,255,255,0.08); } .btn-primary:hover:not(:disabled) { background: linear-gradient( 180deg, #ffffff, #e3e3e3 ); box-shadow: 0 1px 0 rgba(255,255,255,1) inset, 0 15px 35px rgba(255,255,255,0.13); } .btn-secondary { background: rgba(255,255,255,0.045); color: var(--text); border-color: var(--border-hi); } .btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.25); } .btn-row { display: flex; gap: 10px; flex-wrap: wrap; } .btn-row .btn { flex: 0 1 auto; } .btn-row .btn-primary { flex: 1 1 200px; } /* ========================================================= EXPIRY ========================================================= */ .meter { display: flex; flex-direction: column; gap: 11px; padding: 15px 17px; background: rgba(0,0,0,0.42); border: 1px solid var(--border); border-radius: var(--radius-sm); } .meter-top { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-family: var(--mono); } .meter-top .lbl { color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; } .meter-top .val { font-weight: 500; font-size: 12.5px; } .meter-top .val.fresh { color: #fff; } .meter-top .val.warn { color: #d0d0d0; } .meter-top .val.dead { color: var(--danger); } .meter-top .val.none { color: var(--text-faint); } .meter-track { height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden; } .meter-fill { height: 100%; border-radius: 999px; background: linear-gradient( 90deg, #ffffff, #888888 ); transition: width 1s linear, background 0.3s; box-shadow: 0 0 14px rgba(255,255,255,0.25); } /* ========================================================= AUTO REFRESH ========================================================= */ .toggle-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; } .switch { display: inline-flex; align-items: center; gap: 11px; padding: 9 lor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } } /* ========================================================= DISCORD / COMMUNITY ========================================================= */ .discord-btn { display: flex; align-items: center; justify-content: center; gap: 11px; padding: 14px 20px; background: linear-gradient( 180deg, #ffffff, #cfcfcf ); color: #050505; border: none; border-radius: var(--radius-sm); font-family: var(--sans); font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 14px 32px rgba(255,255,255,0.08); transition: transform 0.1s, filter 0.15s, box-shadow 0.15s; width: 100%; } .discord-btn:hover { filter: brightness(1.06); box-shadow: 0 1px 0 rgba(255,255,255,1) inset, 0 18px 38px rgba(255,255,255,0.13); } .discord-btn:active { transform: scale(0.98); } .discord-btn svg { width: 20px; height: 20px; flex-shrink: 0; } .discord-btn.copied { background: linear-gradient( 180deg, #ffffff, #bdbdbd ); } /* Community credit */ .community-credit { text-align: center; margin-top: -3px; font-family: var(--mono); font-size: 11px; color: var(--text-faint); letter-spacing: 0.03em; } .community-credit strong { color: #bdbdbd; font-weight: 500; transition: color 0.2s; } .community-credit:hover strong { color: #fff; } /* ========================================================= OUTPUT ========================================================= */ .output-block { display: flex; flex-direction: column; gap: 8px; } .output-label { font-size: 11px; font-family: var(--mono); color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; } .output-field { position: relative; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 15px 68px 15px 17px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; word-break: break-all; white-space: pre-wrap; max-height: 104px; overflow-y: auto; color: #d4d4d4; } .copy-btn { position: absolute; top: 11px; right: 11px; font-family: var(--sans); font-size: 11px; font-weight: 500; background: rgba(255,255,255,0.06); border: 1px solid var(--border-hi); color: var(--text-dim); padding: 6px 11px; border-radius: 7px; cursor: pointer; transition: all 0.15s; } .copy-btn:hover { background: rgba(255,255,255,0.11); color: #fff; } .copy-btn.copied { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.35); color: #fff; } /* ========================================================= FOOTER ========================================================= */ .footer { text-align: center; font-size: 11.5px; font-family: var(--mono); color: var(--text-faint); padding-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; } .footer .sep { opacity: 0.4; } /* ========================================================= TOAST ========================================================= */ .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(140%); display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: rgba(15,15,15,0.94); backdrop-filter: blur(22px); border: 1px solid var(--border-hi); border-radius: 14px; font-size: 13px; color: var(--text); box-shadow: 0 24px 60px rgba(0,0,0,0.85), 0 0 30px rgba(255,255,255,0.035); z-index: 9999; white-space: nowrap; opacity: 0; transition: transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s; } .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; } .toast.hide { transform: translateX(-50%) translateY(140%); opacity: 0; } .toast .emoji { font-size: 19px; filter: grayscale(1) drop-shadow(0 0 8px rgba(255,255,255,0.3)); } .toast strong { color: #fff; font-weight: 600; } /* ========================================================= RESPONSIVE ========================================================= */ @media (prefers-reduced-motion: reduce) { .spinner, .brand-icon, .version .dot { animation: none !important; } .meter-fill { transition: none; } * { transition-duration: 0.01ms !important; } } @media (max-width: 560px) { .shell { padding: 68px 16px 80px; } .panel { padding: 20px; } .btn-row { flex-direction: column; } .btn-row .btn { width: 100%; } .brand-name { font-size: 22px; } .version { top: 14px; right: 14px; padding: 6px 12px; } } </style> </head> <body> <div class="aurora"></div> <canvas id="snow"></canvas> <div class="version"> <span class="dot"></span> v1.0 </div> <div class="shell"> <!-- HEADER --> <div class="header"> <div class="brand-icon"> 🦈 </div> <div> <div class="brand-name"> Shark Refresher </div> <div class="brand-sub"> Token Refresher </div> </div> </div> <!-- INPUT PANEL --> <div class="panel"> <div class="panel-label"> paste token or json </div> <div class="dropzone" id="dropZone" onclick="document.getElementById('fileIn').click()" > <div class="dz-icon">📁</div> <div> drop a <strong>.json</strong> file here, or click to browse </div> </div> <input type="file" id="fileIn" accept=".json" style="display:none" > <textarea class="input" id="refreshInput" placeholder="paste your refresh_token or full JSON here..." ></textarea> <!-- EXPIRY --> <div class="meter"> <div class="meter-top"> <span class="lbl"> expires in </span> <span class="val none" id="expiryVal" > — </span> </div> <div class="meter-track"> <div class="meter-fill" id="expiryBar" style="width:0%" ></div> </div> </div> <!-- BUTTONS --> <div class="btn-row"> <button class="btn btn-primary" id="refreshBtn" onclick="doRefresh()" > <span>⟳</span> Refresh token </button> <button class="btn btn-secondary" onclick="clearAll()" > Clear </button> </div> <!-- AUTO REFRESH --> <div class="toggle-row"> <button class="switch" id="autoBtn" onclick="toggleAuto()" > <span class="switch-track"> <span class="switch-thumb"></span> </span> <span> Auto-refresh </span> </button> <span class="countdown" id="autoInfo" > next in <strong id="aut ass="output-field"> <span id="outRefresh"> — </span> <button class="copy-btn" onclick="copyField('outRefresh', this)" > copy </button> </div> </div> <button class="btn btn-secondary" style="align-self:flex-start;" onclick="downloadJSON()" > ↓ Download as JSON </button> </div> <div class="footer"> <span> 🦈 shark refresher </span> <span class="sep"> · </span> <span> Made by Ellernate.lol </span> </div> </div> <!-- TOAST --> <div class="toast" id="welcomeToast" > <span class="emoji">🦈</span> <span> welcome to <strong>Shark Refresher</strong> </span> </div> <script> /* ========================================================= INFINITE WHITE SNOW Particles continuously travel both UP and DOWN. ========================================================= */ (function snow() { const canvas = document.getElementById("snow"); const ctx = canvas.getContext("2d"); let flakes = []; let w; let h; function resize() { const dpr = Math.min(window.devicePixelRatio || 1, 2); w = window.innerWidth; h = window.innerHeight; canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.width = w + "px"; canvas.style.height = h + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); const count = Math.min( 180, Math.floor(w * h / 11500) ); flakes = []; for (let i = 0; i < count; i++) { const direction = Math.random() > 0.5 ? 1 : -1; flakes.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.45 + 0.35, speed: (Math.random() * 0.55 + 0.2) * direction, vx: (Math.random() - 0.5) * 0.22, drift: Math.random() * Math.PI * 2, driftSpeed: Math.random() * 0.018 + 0.004, alpha: Math.random() * 0.55 + 0.18, glow: Math.random() * 7 + 3 }); } } function draw() { ctx.clearRect( 0, 0, w, h ); for (const f of flakes) { f.drift += f.driftSpeed; f.x += f.vx + Math.sin(f.drift) * 0.28; f.y += f.speed; /* * Infinite wrapping: * * Downward particles reappear * at the top. * * Upward particles reappear * at the bottom. */ if (f.speed > 0 && f.y > h + 6) { f.y = -6; f.x = Math.random() * w; } if (f.speed < 0 && f.y < -6) { f.y = h + 6; f.x = Math.random() * w; } if (f.x > w + 6) { f.x = -6; } if (f.x < -6) { f.x = w + 6; } /* * Soft white glow. */ ctx.beginPath(); ctx.shadowBlur = f.glow; ctx.shadowColor = "rgba(255,255,255," + f.alpha + ")"; ctx.arc( f.x, f.y, f.r, 0, Math.PI * 2 ); ctx.fillStyle = "rgba(255,255,255," + f.alpha + ")"; ctx.fill(); ctx.shadowBlur = 0; } requestAnimationFrame(draw); } window.addEventListener( "resize", resize ); resize(); draw(); })(); /* ========================================================= API ========================================================= */ const API = "https://stellarapi-backend-production.up.railway.app"; /* ========================================================= STATE ========================================================= */ let currentRefreshToken = null; let currentBearer = null; let newBearer = null; let newRefresh = null; let expiryTimer = null; let autoEnabled = false; let autoInterval = null; let autoCountdownSecs = 0; let autoCountdownInt = null; const AUTO_BEFORE_EXPIRY_SEC = 120; const AUTO_FALLBACK_SEC = 3300; /* ========================================================= PARSE INPUT ========================================================= */ function parseInput(raw) { raw = raw.trim(); try { const j = JSON.parse(raw); return { bearer: j.bearer || j.access_token || j.token || null, refresh: j.refresh_token || j.refreshToken || null }; } catch (_) {} return { bearer: null, refresh: raw }; } /* ========================================================= FILE DROP ========================================================= */ const dropZone = document.getElementById("dropZone"); const fileIn = document.getElementById("fileIn"); dropZone.addEventListener( "dragover", e => { e.preventDefault(); dropZone.classList.add("drag"); } ); dropZone.addEventListener( "dragleave", () => { dropZone.classList.remove("drag"); } ); dropZone.addEventListener( "drop", e => { e.preventDefault(); dropZone.classList.remove("drag"); loadFile( e.dataTransfer.files[0] ); } ); fileIn.addEventListener( "change", e => { loadFile(e.target.files[0]); } ); function loadFile(file) { if (!file) return; const r = new FileReader(); r.onload = ev => { document.getElementById( "refreshInput" ).value = ev.target.result; parseAndPreview( ev.target.result ); }; r.readAsText(file); } /* ========================================================= EXPIRY PREVIEW ========================================================= */ document .getElementById("refreshInput") .addEventListener( "input", e => { parseAndPreview( e.target.value ); } ); function parseAndPreview(raw) { const { bearer, refresh } = parseInput(raw); currentBearer = bearer; currentRefreshToken = refresh; const token = bearer || refresh; if (token) { updateExpiryDisplay(token); } else { resetExpiry(); } } function updateExpiryDisplay(jwt) { clearInterval(expiryTimer); try { const payload = JSON.parse( atob( jwt .split(".")[1] .replace(/-/g, "+") .replace(/_/g, "/") ) ); if (!payload.exp) { resetExpiry(); return; } const expMs = payload.exp * 1000; const iatMs = (payload.iat || (Date.now() / 1000 - 604800)) * 1000; const total = expMs - iatMs; tick( expMs, total ); expiryTimer = setInterval( () => tick(expMs, total), 1000 ); } catch (_) { resetExpiry(); } } function tick(expMs, total) { const now = Date.now(); const left = expMs - now; const el = document.getElementById( "expiryVal" ); const bar = document.getElementById( "expiryBar" ); if (left <= 0) { el.textContent = "expired"; el.className = "val dead"; bar.style.width = "0%"; bar.style.background = "linear-gradient(90deg,#ff4444,#ff7070)"; clearInterval(expiryTimer); return; } const pct = Math.max( 0, Math.min( 100, (left / total) * 100 ) ); const hrs = Math.floor( left / 3600000 ); const mins = Math.floor( (left % 3600000) / 60000 ); const secs = Math.floor( (left % 60000) / 1000 ); el.textContent = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m ${secs}s`; el.className = `val ${ pct > 40 ? "fresh" : pct > 15 ? "warn" : "dead" }`; if (pct > 40) { bar.style.background = "linear-gradient(90deg,#ffffff,#888888)"; } else if (pct > 15) { bar.style.background = "linear-gradient(90deg,#dddddd,#999999)"; } else { bar.style.background = "linear-gradient(90deg,#ef4444,#ff7070)"; } bar.style.width = pct + "%"; } function resetExpiry() { clearInterval(expiryTimer); document.getElementById( "expiryVal" ).textContent = "—"; document.getElementById( "expiryVal" ).className = "val none"; document.getElementById( "expiryBar" ).style.width = "0%"; } /* ========================================================= REFRESH ========================================================= */ async function doRefresh() { const raw = document .getElementById("refreshInput") .value .trim(); if (!raw) { return setStatus( "error", "paste a token first" ); } const { bearer, refresh } = parseInput(raw); if (!refresh) { return setStatus( "error", "no refresh_token found in input" ); } currentRefreshToken = refresh; currentBearer = bearer; setStatus( "loading", "refreshing token..." ); document .getElementById("refreshBtn") .disabled = true; const endpoints = [ { url: `${API}/auth/refresh`, body: { refresh_token: refresh } }, { url: `${API}/v1/auth/refresh`, body: { refresh_token: refresh } }, { url: `${API}/refresh`, body: { refresh_token: refresh } }, { url: `${API}/token/refresh`, body: { refresh_token: refresh } } ]; const headers = { "Content-Type": "application/json" }; if (bearer) { headers.Authorization = `Bearer ${bearer}`; } let lastErr = null; for (const ep of endpoints) { try { const res = await fetch( ep.url, { method: "POST", headers, body: JSON.stringify( ep.body ) } ); const ct = res.headers.get( "content-type" ) || ""; const data = ct.includes("json") ? await res.json() : await res.text(); if (res.ok) { const nb = data.bearer || data.access_token || data.token || data.accessToken || null; const nr = data.refresh_token || data.refreshToken || null; if (!nb && !nr) { lastErr = "200 but no tokens in response"; continue; } newBearer = nb; newRefresh = nr; showOutput( nb, nr ); setStatus( "success", `refreshed at ${new Date().toLocaleTimeString()}` ); if (nb) { updateExpiryDisplay(nb); } document .getElementById("refreshBtn") .disabled = false; return; } lastErr = `${res.status}: ${JSON.stringify(data).slice(0,120)}`; } catch (e) { lastErr = e.message; } } setStatus( "error", lastErr || "all endpoints failed" ); document .getElementById("refreshBtn") .disabled = false; } /* ========================================================= OUTPUT ========================================================= */ function showOutput( bearer, refresh ) { document.getElementById( "outBearer" ).textContent = bearer || "(none returned)"; document.getElementById( "outRefresh" ).textContent = refresh || "(none returned)"; document.getElementById( "outputWrap" ).style.display = "flex"; } function copyField( id, btn ) { const text = document.getElementById( id ).textContent; navigator.clipboard .writeText(text) .then(() => { btn.textContent = "copied"; btn.classList.add( "copied" ); setTimeout(() => { btn.textContent = "copy"; btn.classList.remove( "copied" ); }, 1800); }); } function downloadJSON() { const obj = { _note: "thanks for using Shark Refresher 🦈", bearer: newBearer || "", refresh_token: newRefresh || "" }; const blob = new Blob( [ JSON.stringify( obj, null, 2 ) ], { type: "application/json" } ); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "shark_refreshed_tokens.json"; a.click(); } /* ========================================================= STATUS ========================================================= */ function setStatus( type, msg ) { const el = document.getElementById( "status" ); el.className = `status show ${type}`; if (type === "loading") { el.innerHTML = `<div class="spinner"></div> <span>${msg}</span>`; } else { const icon = type === "success" ? "✓" : "✗"; el.innerHTML = `<span>${icon}</span> <span>${msg}</span>`; } } /* ========================================================= AUTO REFRESH ========================================================= */ function toggleAuto() { autoEnabled = !autoEnabled; const btn = document.getElementById( "autoBtn" ); const info = document.getElementById( "autoInfo" ); if (autoEnabled) { const raw = document .getElementById( "refreshInput" ) .value .trim(); if (!raw) { autoEnabled = false; setStatus( "error", "paste a token first, then enable auto-refresh" ); return; } btn.classList.add("on"); info.classList.add("show"); scheduleNextAuto(); } else { stopAuto(); } } function scheduleNextAuto() { clearTimeout( autoInterval ); clearInterval( autoCountdownInt ); let delaySec = AUTO_FALLBACK_SEC; const tokenForExpiry = newBearer || currentBearer || currentRefreshToken; if (tokenForExpiry) { try { const payload = JSON.parse( atob( tokenForExpiry .split(".")[1] .replace(/-/g, "+") .replace(/_/g, "/") ) ); if (payload.exp) { const secLeft = payload.exp - Math.floor( Date.now() / 1000 ); delaySec = Math.max( 10, secLeft - AUTO_BEFORE_EXPIRY_SEC ); } } catch (_) {} } autoCountdownSecs = delaySec; updateCountdownDisplay(); autoCountdownInt = setInterval(() => { autoCountdownSecs--; if ( autoCountdownSecs <= 0 ) { autoCountdownSecs = 0; } updateCountdownDisplay(); }, 1000); autoInterval = setTimeout( async () => { clearInterval( autoCountdownInt ); if (!autoEnabled) { return; } await doRefresh(); if (autoEnabled) { scheduleNextAuto(); } }, delaySec * 1000 ); } function updateCountdownDisplay() { const el = document.getElementById( "autoCountdown" ); const s = autoCountdownSecs; const h = Math.floor( s / 3600 ); const m = Math.floor( (s % 3600) / 60 ); const sc = s % 60; el.textContent = h > 0 ? `${h}h ${m}m ${sc}s` : m > 0 ? `${m}m ${sc}s` : `${sc}s`; } function stopAuto() { autoEnabled = false; clearTimeout( autoInterval ); clearInterval( autoCountdownInt ); autoInterval = null; autoCountdownInt = null; document .getElementById("autoBtn") .classList.remove("on"); document .getElementById("autoInfo") .classList.remove("show"); } /* ========================================================= CLEAR ========================================================= */ function clearAll() { stopAuto(); document.getElementById( "refreshInput" ).value = ""; document.getElementById( "outputWrap" ).style.display = "none"; document.getElementById( "status" ).className = "status"; currentRefreshToken = null; currentBearer = null; newBearer = null; newRefresh = null; resetExpiry(); } /* ========================================================= DISCORD ========================================================= */ const DISCORD_INVITE = "https://discord.gg/DvfqcxnWN"; async function copyDiscord(btn) { const label = document.getElementById( "discordBtnText" ); const original = label.textContent; try { await navigator.clipboard.writeText( DISCORD_INVITE ); btn.classList.add( "copied" ); label.textContent = "Invite copied!"; setTimeout(() => { btn.classList.remove( "copied" ); label.textContent = original; }, 1900); } catch (_) { const ta = document.createElement( "textarea" ); ta.value = DISCORD_INVITE; document.body.appendChild( ta ); ta.select(); try { document.execCommand( "copy" ); } catch (_) {} document.body.removeChild( ta ); btn.classList.add( "copied" ); label.textContent = "Invite copied!"; setTimeout(() => { btn.classList.remove( "copied" ); label.textContent = original; }, 1900); } } /* ========================================================= WELCOME TOAST ========================================================= */ window.addEventListener( "load", () => { const toast = document.getElementById( "welcomeToast" ); setTimeout( () => toast.classList.add( "show" ), 400 ); setTimeout( () => { toast.classList.remove( "show" ); toast.classList.add( "hide" ); }, 3800 ); } ); </script> </body> </html>
